<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XST/SOL — Pool</title>
<style>
  :root {
    --orange: #EA580C; --orange-dark: #C2410C;
    --ink: #1C1917; --paper: #FAFAF9; --card: #FFFFFF; --line: #E7E5E4;
    --muted: #78716C; --green: #16A34A; --red: #DC2626; --amber: #D97706;
    --blue: #2563EB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Archivo", "Helvetica Neue", system-ui, sans-serif; background: var(--paper); color: var(--ink); padding: 24px; max-width: 1280px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; border-bottom: 3px solid var(--ink); padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.5px; }
  header h1 span { color: var(--orange); }
  header .addr { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted); cursor: pointer; border-bottom: 1px dashed var(--line); }
  header .meta { color: var(--muted); font-size: 13px; margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .badge { display: inline-block; padding: 2px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; background: var(--orange); clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .badge.ink { background: var(--ink); } .badge.ok { background: var(--green); } .badge.warn { background: var(--amber); } .badge.red { background: var(--red); } .badge.blue { background: var(--blue); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.ok { background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--line); padding: 14px 16px; position: relative; }
  .kpi::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--orange); }
  .kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; }
  .kpi .value { font-size: 22px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  section { background: var(--card); border: 1px solid var(--line); margin-bottom: 20px; }
  section > h2 { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  section > h2 .st { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12px; }
  .chartWrap { padding: 16px; }
  canvas { width: 100%; height: 340px; display: block; }
  .legend { display: flex; gap: 18px; padding: 0 16px 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .bar { height: 8px; background: var(--line); position: relative; min-width: 60px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  details { border-bottom: 1px solid var(--line); }
  details:last-child { border-bottom: none; }
  details summary { cursor: pointer; padding: 11px 16px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸"; color: var(--orange); transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details .body { padding: 4px 0 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; }
  .chip { font-size: 11px; font-weight: 700; padding: 3px 10px; border: 1px solid var(--line); background: var(--paper); clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%); }
  .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--ink); color: #E7E5E4; padding: 14px 16px; overflow-x: auto; user-select: all; }
  .note { font-size: 13px; line-height: 1.55; color: var(--ink); padding: 12px 16px; }
  .note b { color: var(--orange-dark); }
  .err { display: none; background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }
  .muted { color: var(--muted); }
  @media (max-width: 720px) { body { padding: 14px; } .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1 id="title">Pool</h1>
  <span class="addr" id="addr" title="cliquer pour copier"></span>
  <span class="meta"><span class="dot ok"></span><span id="live">chargement…</span></span>
</header>

<div class="err" id="err"></div>

<div class="kpis" id="kpis"></div>

<section>
  <h2>Prix <span class="st">bougies journalières (interval API ignoré → 24h) · zones échelle &amp; Fib du dernier scan</span></h2>
  <div class="chartWrap"><canvas id="chart"></canvas></div>
  <div class="legend" id="legend"></div>
</section>

<section>
  <h2>Volume &amp; frais par fenêtre</h2>
  <table id="winTable"></table>
</section>

<section>
  <h2>Contexte scan</h2>
  <div class="grid2" id="scanGrid"></div>
  <div class="chips" id="scanChips"></div>
</section>

<section>
  <h2>Pool</h2>
  <details open><summary>Jeton XST</summary><div class="body" id="tokX"></div></details>
  <details><summary>Jeton SOL (quote)</summary><div class="body" id="tokY"></div></details>
  <details><summary>Config du pool</summary><div class="body" id="cfg"></div></details>
  <details><summary>Réserves &amp; cumul</summary><div class="body" id="reserves"></div></details>
</section>

<section>
  <h2>Pilote réel</h2>
  <div class="note" id="pilotNote"></div>
  <div class="code" id="pilotKill"></div>
</section>

<section>
  <h2>Historique paper (10 dernières sur ce pool)</h2>
  <table id="paperTable"></table>
</section>

<script>
const POOL = new URLSearchParams(location.search).get("addr") || "FXc1BVyNDmqwSKbYD8JwMGq5uqsUov4BCjqnATAeyARk";
const ADDR = POOL;
const $ = (id) => document.getElementById(id);

const f2 = (n) => (Number.isFinite(n) ? n.toLocaleString("en-US", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) : "—");
const f0 = (n) => (Number.isFinite(n) ? Math.round(n).toLocaleString("en-US") : "—");
function fc(n) { // compact
  if (!Number.isFinite(n)) return "—";
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return f2(n);
}
const usd = (n) => "$" + fc(n);
const pct = (n) => (Number.isFinite(n) ? f2(n) + " %" : "—");
const sig = (n) => (Number.isFinite(n) ? n.toPrecision(4) : "—");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const binPrice = (binId, step) => Math.pow(1 + step / 10000, binId);
const dateStr = (ts) => new Date(ts * 1000).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });

function kvRow(k, v, cls) { return `<div class="kv"><span class="k">${k}</span><span class="v ${cls || ""}">${v}</span></div>`; }

function render(d) {
  const p = d.pool, s = d.scan, h = s?.hint || {};
  $("title").innerHTML = esc((p.name || "POOL").split("-")[0]) + "<span>/" + esc(p.token_y?.symbol || "SOL") + "</span>";
  $("addr").textContent = POOL;
  $("live").textContent = "màj " + new Date(d.fetched_at).toLocaleTimeString("fr-FR");

  // ---- KPIs ----
  const ftr24 = p.fee_tvl_ratio?.["24h"] ?? null;
  const aprRun = ftr24 != null ? (ftr24 / 100) * 365 * (1 - (p.pool_config?.protocol_fee_pct ?? 10) / 100) : null;
  const age = s?.age_days ?? ((Date.now() - p.created_at) / 86400000);
  const kpis = [
    ["Prix", sig(p.current_price) + " SOL", p.token_x?.price ? usd(p.token_x.price) + " / XST" : ""],
    ["TVL", usd(p.tvl), p.token_x?.symbol + "/" + p.token_y?.symbol],
    ["Volume 24h", usd(p.volume?.["24h"]), "30m : " + usd(p.volume?.["30m"])],
    ["Fees 24h", usd(p.fees?.["24h"]), "30m : " + usd(p.fees?.["30m"])],
    ["Fees/TVL 24h", pct(ftr24), aprRun ? "APR run-rate ≈ " + (aprRun * 100).toLocaleString("en-US", { maximumFractionDigits: 0 }) + " %" : ""],
    ["Fee dynamique", pct(p.dynamic_fee_pct), "base " + pct(p.pool_config?.base_fee_pct)],
    ["Bin step", String(p.pool_config?.bin_step ?? "—"), "protocol " + pct(p.pool_config?.protocol_fee_pct)],
    ["Âge pool", age != null ? f1(age) + " j" : "—", s?.launchpad ? "launchpad " + s.launchpad : "pas de launchpad"],
  ];
  $("kpis").innerHTML = kpis.map(([l, v, sub]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${sub || ""}</div></div>`).join("");
  function f1(n) { return (Math.round(n * 10) / 10).toString().replace(".", ","); }

  // ---- Chart ----
  drawChart(d);

  // ---- Windows ----
  const win = ["30m", "1h", "2h", "4h", "12h", "24h"];
  const rows = win.map((w) => {
    const v = p.volume?.[w] ?? null, f = p.fees?.[w] ?? null, r = p.fee_tvl_ratio?.[w] ?? null;
    return { w, v, f, r };
  });
  const maxR = Math.max(...rows.map((x) => x.r ?? 0), 0.0001);
  $("winTable").innerHTML =
    "<tr><th>fenêtre</th><th>volume</th><th>fees</th><th>fees/TVL</th><th style='width:30%'></th></tr>" +
    rows.map((x) => `<tr><td><b>${x.w}</b></td><td>${usd(x.v)}</td><td>${usd(x.f)}</td><td>${pct(x.r)}</td><td><div class="bar"><i style="width:${Math.max(2, ((x.r ?? 0) / maxR) * 100)}%"></i></div></td></tr>`).join("");

  // ---- Scan context ----
  if (s) {
    const dep = s.launchpad === "pump.fun" || s.age_days < 7 ? 500 : p.tvl >= 500000 && p.volume_24h >= 5000000 ? 2000 : 1000;
    const cls = dep === 500 ? "exploratoire" : dep === 2000 ? "major" : "conviction";
    const ctx = [
      ["Score", f2(s.score)],
      ["Stratégie", esc(h.strategy || "—")],
      ["Dip target", h.dipTarget != null ? (h.dipTarget * 100).toFixed(0) + " %" : "—"],
      ["Drawdown 24h", h.drawdown24h != null ? (h.drawdown24h * 100).toFixed(1) + " %" : "—"],
      ["Échelle (bins)", h.minBinId != null ? h.minBinId + " → " + h.maxBinId : "—"],
      ["Sizing satsmonkes", cls + " " + dep + " $"],
      ["Zone Fib", h.fibZone ? sig(h.fibZone.level50) + " → " + sig(h.fibZone.level786) : "—"],
      ["Age / Launchpad", f1(s.age_days) + " j" + (s.launchpad ? " · " + s.launchpad : "")],
    ];
    $("scanGrid").innerHTML = ctx.map(([k, v]) => kvRow(k, v)).join("");
    $("scanChips").innerHTML = (s.signals || []).map((x) => `<span class="chip">${esc(x)}</span>`).join("");
  } else {
    $("scanGrid").innerHTML = `<div class="note muted">Aucun scan récent pour ce pool.</div>`;
  }

  // ---- Pool details ----
  const tx = p.token_x, ty = p.token_y, pc = p.pool_config, cm = p.cumulative_metrics;
  $("tokX").innerHTML =
    kvRow("Nom / symbole", esc(tx?.name) + " (" + esc(tx?.symbol) + ")") +
    kvRow("Prix", usd(tx?.price)) + kvRow("Market cap", usd(tx?.market_cap)) +
    kvRow("Holders", f0(tx?.holders)) + kvRow("Supply totale", fc(tx?.total_supply)) +
    kvRow("Vérifié", tx?.is_verified ? "oui" : "non") + kvRow("Freeze désactivé", tx?.freeze_authority_disabled ? "oui" : "non");
  $("tokY").innerHTML =
    kvRow("Nom / symbole", esc(ty?.name) + " (" + esc(ty?.symbol) + ")") +
    kvRow("Prix", usd(ty?.price)) + kvRow("Market cap", usd(ty?.market_cap));
  $("cfg").innerHTML =
    kvRow("Bin step", String(pc?.bin_step)) + kvRow("Fee de base", pct(pc?.base_fee_pct)) +
    kvRow("Fee max", pct(pc?.max_fee_pct)) + kvRow("Fee protocol", pct(pc?.protocol_fee_pct)) +
    kvRow("Fee dynamique", pct(p.dynamic_fee_pct)) + kvRow("Créé le", new Date(p.created_at).toLocaleDateString("fr-FR")) +
    kvRow("Launchpad", s?.launchpad || "—");
  $("reserves").innerHTML =
    kvRow("Réserve X (" + esc(tx?.symbol) + ")", fc(p.token_x_amount)) +
    kvRow("Réserve Y (" + esc(ty?.symbol) + ")", fc(p.token_y_amount)) +
    kvRow("Volume cumulé", usd(cm?.volume)) + kvRow("Fees cumulées", usd(cm?.fees)) +
    kvRow("Prix courant", sig(p.current_price) + " " + esc(ty?.symbol) + "/" + esc(tx?.symbol));

  // ---- Pilote réel ----
  const realOpen = (d.real || []).find((r) => r.status === "open");
  if (realOpen) {
    $("pilotNote").innerHTML =
      `<b>Position RÉELLE ouverte</b> le ${esc(realOpen.opened)} · ${esc(realOpen.strategy)} · ` +
      `<b>${usd(realOpen.deposit_usd)}</b> (${f2(realOpen.amount_y)} SOL) · range ${realOpen.min_bin_id}→${realOpen.max_bin_id} ` +
      `· pubkey <span class="addr">${esc(realOpen.position_pubkey)}</span> · <span class="badge ok">${esc(realOpen.status)}</span>`;
    $("pilotKill").textContent =
      `REAL_MODE=true REAL_CONFIRM=CONFIRMED-REAL-MODE npm run real:close -- --pubkey ${realOpen.position_pubkey} --pool ${POOL} --bps 10000`;
  } else {
    $("pilotNote").innerHTML =
      `<b>Plan (sizing satsmonkes)</b> : bidask-dip · classe par dépôt (exploratoire 500 $ / conviction 1 000 $ / major 2 000 $)` +
      (h.dipTarget != null ? ` · dipTarget ${(h.dipTarget * 100).toFixed(0)} %` : "") +
      (h.drawdown24h != null ? ` · drawdown 24h ${(h.drawdown24h * 100).toFixed(0)} %` : "") +
      `.<br><b>Limite on-chain (22/08)</b> : échelle plafonnée à 69 bins (largeur &lt; 70 exigée par le programme, realloc 10 240 o) — clamp automatique dans real.ts.`;
    $("pilotKill").textContent =
      `REAL_MODE=true REAL_CONFIRM=CONFIRMED-REAL-MODE npm run real:close -- --pubkey <POS> --pool ${POOL} --bps 10000`;
  }

  // ---- Paper ----
  const rows2 = d.paper || [];
  $("paperTable").innerHTML =
    "<tr><th>ouvert</th><th>stratégie</th><th>dépôt</th><th>fees</th><th>statut</th></tr>" +
    (rows2.length
      ? rows2.map((r) => `<tr><td>${esc(r.opened)}</td><td>${esc(r.strategy)}</td><td>${usd(r.deposit_usd)}</td><td>${usd(r.fees_earned_usd)}</td><td><span class="badge ${r.status === "open" ? "ok" : "ink"}">${esc(r.status)}</span></td></tr>`).join("")
      : `<tr><td colspan="5" class="muted">Aucune position paper sur ce pool.</td></tr>`);
}

function drawChart(d) {
  const c = $("chart"), ctx = c.getContext("2d");
  const DPR = window.devicePixelRatio || 1, W = c.clientWidth, H = 340;
  c.width = W * DPR; c.height = H * DPR; ctx.scale(DPR, DPR);
  ctx.clearRect(0, 0, W, H);

  const candles = d.candles || [];
  const p = d.pool, h = d.scan?.hint || {}, step = p.pool_config?.bin_step || 20;
  const cur = p.current_price;
  const pad = { l: 74, r: 14, t: 10, b: 24 };

  // zones (échelle + fib) en prix
  const ladderLow = h.minBinId != null ? binPrice(h.minBinId, step) : null;
  const ladderHigh = h.maxBinId != null ? binPrice(h.maxBinId, step) : cur;
  const fib = h.fibZone;
  const fibLow = fib ? fib.level786 : null, fibHigh = fib ? fib.level50 : null;

  let min = 0, max = 0;
  candles.forEach((k) => { min = Math.min(min, k.low); max = Math.max(max, k.high); });
  min = Math.min(min, cur, ladderLow ?? 1e9, fibLow ?? 1e9);
  max = Math.max(max, cur, ladderHigh ?? 0, fibHigh ?? 0);
  if (min >= max) { min = cur * 0.9; max = cur * 1.1; }
  const span = max - min || 1;
  min -= span * 0.05; max += span * 0.05;

  const X = (i, n) => pad.l + (i / Math.max(1, n - 1)) * (W - pad.l - pad.r);
  const Y = (v) => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);
  const P = (v) => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);

  // grille + labels Y (log-ish ticks linéaires)
  ctx.font = "10px ui-monospace, monospace"; ctx.fillStyle = "#78716C"; ctx.strokeStyle = "#E7E5E4"; ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const v = min + ((max - min) * i) / 5, y = P(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    ctx.fillText(v.toExponential(1), 4, y + 3);
  }

  // zones
  if (ladderLow != null) {
    ctx.fillStyle = "rgba(234, 88, 12, 0.12)";
    ctx.fillRect(pad.l, P(ladderLow), W - pad.l - pad.r, Math.max(1, P(cur) - P(ladderLow)));
    ctx.fillStyle = "#EA580C"; ctx.font = "bold 10px Archivo, sans-serif";
    ctx.fillText("échelle bidask-dip", pad.l + 6, P(ladderLow) + 12);
  }
  if (fibLow != null && fibHigh != null) {
    ctx.fillStyle = "rgba(37, 99, 235, 0.10)";
    ctx.fillRect(pad.l, P(fibHigh), W - pad.l - pad.r, Math.max(1, P(fibLow) - P(fibHigh)));
    ctx.fillStyle = "#2563EB"; ctx.font = "bold 10px Archivo, sans-serif";
    ctx.fillText("zone Fib 50–78.6", pad.l + 6, P(fibHigh) + 12);
  }

  // bougies
  const n = candles.length;
  candles.forEach((k, i) => {
    const up = k.close >= k.open;
    const x = X(i, n), bw = Math.max(3, (W - pad.l - pad.r) / n * 0.6);
    ctx.strokeStyle = up ? "#16A34A" : "#DC2626"; ctx.fillStyle = up ? "#16A34A" : "#DC2626";
    ctx.beginPath(); ctx.moveTo(x, P(k.high)); ctx.lineTo(x, P(k.low)); ctx.stroke();
    const y0 = P(Math.max(k.open, k.close)), y1 = P(Math.min(k.open, k.close));
    ctx.fillRect(x - bw / 2, y0, bw, Math.max(1, y1 - y0));
    ctx.fillStyle = "#78716C"; ctx.font = "9px ui-monospace, monospace";
    ctx.fillText(dateStr(k.timestamp), x - bw / 2, H - 8);
  });

  // ligne prix courant
  ctx.strokeStyle = "#1C1917"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(pad.l, P(cur)); ctx.lineTo(W - pad.r, P(cur)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#1C1917"; ctx.font = "bold 10px Archivo, sans-serif";
  ctx.fillText("prix " + sig(cur), W - pad.r - 92, P(cur) - 5);
}

async function load() {
  try {
    const r = await fetch("/api/pool/" + ADDR);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    $("err").style.display = "none";
    render(d);
    $("addr").textContent = POOL;
  } catch (e) {
    $("err").style.display = "block";
    $("err").textContent = "Erreur de chargement : " + e.message;
  }
}

$("addr").addEventListener("click", () => { navigator.clipboard?.writeText(POOL); $("addr").textContent = "copié ✓"; setTimeout(() => ($("addr").textContent = POOL), 1200); });
load();
setInterval(load, 60000);
</script>
</body>
</html>
